<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AuthGuard — Simple & Secure Login System</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="locked">

  <!-- ===== Navbar ===== -->
  <nav class="navbar">
    <div class="nav-inner">
      <a class="brand" href="index.html">
        <span class="brand-mark">🛡</span>
        <span class="brand-name">AuthGuard</span>
      </a>
      <div class="nav-links" id="nav-links">
        <a class="nav-link active" href="index.html">Home</a>
        <a class="nav-link" href="login.html">Login</a>
        <a class="nav-link btn-nav" href="register.html">Sign Up</a>
      </div>
    </div>
  </nav>

  <!-- ===== Hero ===== -->
  <header class="hero">
    <div class="hero-inner hero-center">
      <h1>Simple Login.<br>Secure by <span class="grad">Design.</span></h1>
      <p>Register an account, log in with validation and hashed passwords, and unlock your personal dashboard with analytics.</p>
      <div class="hero-cta">
        <a class="btn btn-primary" href="register.html">Create Account</a>
        <a class="btn btn-ghost" href="login.html">Login</a>
      </div>
    </div>
  </header>

  <footer class="site-footer dark">
    <p>Copyright © 2026 <a href="https://aonontojahan.vercel.app" target="_blank" rel="noopener">aonontojahan.vercel.app</a>. All Rights Reserved.</p>
  </footer>

  <script src="auth.js"></script>
  <script>
    // Logged-in visitors see a Dashboard shortcut in the navbar
    (function () {
      if (Auth.currentUser()) {
        document.getElementById('nav-links').innerHTML =
          '<a class="nav-link active" href="index.html">Home</a>' +
          '<a class="nav-link btn-nav" href="dashboard.html">Go to Dashboard →</a>';
      }
    })();
  </script>
</body>
</html>
