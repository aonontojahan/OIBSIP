<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TaskFlow — Login</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="auth-body">
  <nav class="landing-nav">
    <div class="landing-nav-inner">
      <a class="brand" href="index.html"><span class="brand-mark"><span>✓</span></span> TaskFlow</a>
      <div class="nav-links">
        <a class="nav-link" href="index.html">Home</a>
        <a class="nav-pill" href="login.html">Login</a>
        <a class="nav-cta" href="register.html">Sign Up</a>
      </div>
    </div>
  </nav>

  <main class="auth-main">
    <form class="auth-card" id="login-form" novalidate>
      <h2>Welcome back 👋</h2>
      <p class="sub">Login with your username or email.</p>
      <div class="form-error" id="login-error" hidden></div>

      <div class="field">
        <label for="login-id">Username or email</label>
        <input type="text" id="login-id" placeholder="Enter username or email" autocomplete="username" maxlength="80">
        <p class="field-error" id="err-login-id" hidden></p>
      </div>
      <div class="field">
        <label for="login-password">Password</label>
        <div class="pass-wrap">
          <input type="password" id="login-password" placeholder="Enter your password" autocomplete="current-password">
          <button type="button" class="toggle-pass" data-for="login-password">Show</button>
        </div>
        <p class="field-error" id="err-login-password" hidden></p>
      </div>

      <button class="btn-primary auth-btn" type="submit">Login</button>
      <p class="auth-switch">New here? <a href="register.html">Create an account</a></p>
    </form>
  </main>

  <footer class="landing-footer">
    Copyright © 2026 <a href="https://aonontojahan.vercel.app" target="_blank" rel="noopener">aonontojahan.vercel.app</a>. All Rights Reserved.
  </footer>

  <script src="auth.js"></script>
  <script>initLogin();</script>
</body>
</html>
