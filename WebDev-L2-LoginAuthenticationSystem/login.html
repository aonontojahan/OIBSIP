<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — AuthGuard</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="locked">

  <!-- ===== Navbar ===== -->
  <nav class="navbar">
    <div class="nav-inner">
      <a class="brand" href="index.html">
        <span class="brand-mark">🛡</span>
        <span class="brand-name">AuthGuard</span>
      </a>
      <div class="nav-links">
        <a class="nav-link" href="index.html">Home</a>
        <a class="nav-link active" href="login.html">Login</a>
        <a class="nav-link btn-nav" href="register.html">Sign Up</a>
      </div>
    </div>
  </nav>

  <!-- ===== Login card ===== -->
  <main class="auth-wrap auth-compact">
    <div class="auth-card single">
      <div class="auth-form-box">
        <h2>Login</h2>
        <p class="muted">Enter your credentials to continue.</p>

        <div class="alert alert-error" id="form-error" role="alert"></div>

        <form id="login-form" autocomplete="off" novalidate>
          <div class="field">
            <label for="login-id">Username or Email</label>
            <input type="text" id="login-id" placeholder="Enter your username or email" maxlength="80">
          </div>
          <div class="field">
            <label for="login-password">Password</label>
            <div class="pass-wrap">
              <input type="password" id="login-password" placeholder="Enter your password" maxlength="72">
              <button type="button" class="pass-toggle" data-toggle="login-password" title="Show password">👁</button>
            </div>
          </div>
          <button type="submit" class="btn btn-primary btn-block" id="login-btn">Login</button>
        </form>

        <p class="form-switch">Don't have an account? <a href="register.html">Sign up here</a></p>
      </div>
    </div>
  </main>

  <footer class="site-footer dark">
    <p>Copyright © 2026 <a href="https://aonontojahan.vercel.app" target="_blank" rel="noopener">aonontojahan.vercel.app</a>. All Rights Reserved.</p>
  </footer>

  <script src="auth.js"></script>
  <script>
    Auth.redirectIfAuthed();

    var form = document.getElementById('login-form');
    var errBox = document.getElementById('form-error');

    // Show / hide password
    document.querySelectorAll('.pass-toggle').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var field = document.getElementById(btn.getAttribute('data-toggle'));
        var show = field.type === 'password';
        field.type = show ? 'text' : 'password';
        btn.textContent = show ? '🙈' : '👁';
      });
    });

    form.addEventListener('submit', function (e) {
      e.preventDefault();
      var id = document.getElementById('login-id').value;
      var pw = document.getElementById('login-password').value;

      var res = Auth.login(id, pw);
      if (!res.ok) {
        errBox.textContent = res.message;
        errBox.classList.add('show');
        return;
      }
      errBox.classList.remove('show');
      var btn = document.getElementById('login-btn');
      btn.disabled = true;
      btn.textContent = 'Logging in…';
      setTimeout(function () { window.location.href = 'dashboard.html'; }, 700);
    });
  </script>
</body>
</html>
