<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TaskFlow — Sign Up</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="auth-body">
  <nav class="landing-nav">
    <div class="landing-nav-inner">
      <a class="brand" href="index.html"><span class="brand-mark"><span>✓</span></span> TaskFlow</a>
      <div class="nav-links">
        <a class="nav-link" href="index.html">Home</a>
        <a class="nav-link" href="login.html">Login</a>
        <a class="nav-pill" href="register.html">Sign Up</a>
      </div>
    </div>
  </nav>

  <main class="auth-main">
    <form class="auth-card" id="register-form" novalidate>
      <h2>Create account 🎉</h2>
      <p class="sub">Join TaskFlow and organize your day.</p>
      <div class="form-error" id="reg-error" hidden></div>
      <div class="form-success" id="reg-success" hidden></div>

      <div class="field">
        <label for="reg-username">Username</label>
        <input type="text" id="reg-username" placeholder="e.g. aonontojahan" autocomplete="username" maxlength="30">
        <p class="field-error" id="err-username" hidden></p>
      </div>
      <div class="field">
        <label for="reg-email">Email</label>
        <input type="email" id="reg-email" placeholder="you@example.com" autocomplete="email" maxlength="80">
        <p class="field-error" id="err-email" hidden></p>
      </div>
      <div class="field">
        <label for="reg-password">Password</label>
        <div class="pass-wrap">
          <input type="password" id="reg-password" placeholder="Min 8 characters + 1 number" autocomplete="new-password">
          <button type="button" class="toggle-pass" data-for="reg-password">Show</button>
        </div>
        <div class="strength"><span id="strength-bar"></span></div>
        <p class="strength-text" id="strength-text">Use 8+ characters with at least 1 number.</p>
        <p class="field-error" id="err-password" hidden></p>
      </div>
      <div class="field">
        <label for="reg-confirm">Confirm password</label>
        <div class="pass-wrap">
          <input type="password" id="reg-confirm" placeholder="Repeat your password" autocomplete="new-password">
          <button type="button" class="toggle-pass" data-for="reg-confirm">Show</button>
        </div>
        <p class="field-error" id="err-confirm" hidden></p>
      </div>

      <button class="btn-primary auth-btn" type="submit" id="register-btn">Register</button>
      <p class="auth-switch">Already have an account? <a href="login.html">Login</a></p>
    </form>
  </main>

  <footer class="landing-footer">
    Copyright © 2026 <a href="https://aonontojahan.vercel.app" target="_blank" rel="noopener">aonontojahan.vercel.app</a>. All Rights Reserved.
  </footer>

  <script src="auth.js"></script>
  <script>initRegister();</script>
</body>
</html>
